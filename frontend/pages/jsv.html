<h3 style="color:blue;"> Eidg. Schützenfest 2014 in der Region Bern <em>(Info-Update: (16.11.2013))</em></h3>


<p>Im kommenden Jahr findet wieder ein Eidg.Schützenfest für Jugendliche statt, diesmal in der Region Bern, (Schönbühl / Grauholz). Wir beabsichtigen wieder mit dem BSVB gemeinsam diesen Anlass zu besuchen und hoffen dass Möglichst alle Jung- und Nachwuchskurse des BSVB dabei sind. </p>

<p>Das Datum ist Definitiv. Wir besuchen den Anlass vom 27. - 29. Juni 2014. <br />Am Herbstrapport der JS-Leiter vom 19. November, (siehe Versammlungen), informieren wir über alle Details. Ihr könnt euch aber jetzt schon Gedanken machen, ob die Vereine bereits am Freitag nach Bern reisen wollen oder erst am Samstag. </p>

<li>Anreise am Freitag oder Samstag möglich</li>
<li>Anreise mit Bahn oder Car</li>
<li>Rückreise am Sonntag</li>

<li>Schiessplatz: Grauholz (Im Sand)</li><li>Unterkunft im Zelt nähe Schiessplatz</li>

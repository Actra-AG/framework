{{STATUS}}

<form method="post" action="seiteMod-{{ORT}}-{{SEITE}}.html?send=1" class="form-edit">
<fieldset>
<dl>
  <dt><label for="text">Inhalt</label></dt>
  <dd><textarea name="text" id="text" cols="40" rows="10" style="width: 500; height=500">{{TEXT}}</textarea></dd>
</dl>
</fieldset>

<fieldset>
<dl>
  <dt><label for="config">Konfiguration</label></dt>
  <dd><textarea name="config" id="config" cols="40" rows="10">{{CONFIG}}</textarea></dd>
</dl>
</fieldset>

<fieldset class="submit"><input type="submit" name="save" value="speichern" /></fieldset>
</form>

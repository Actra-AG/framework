<body id="{{BODYID}}">

<div id="login">

<h1>Administrationsbereich</h1>
<h2>Log In</h2>

<!-- UG_AKTIV START -->
<p>Sie sind bereits eingeloggt. <a href="start.html">weiter</a></p>

{{STATUS}}

<form action="login.html?send=1" method="post">
<fieldset>
<ol>
<li>
	<label for="loginemail">E-Mail</label>
  <input type="text" class="text" name="loginemail" id="loginemail" value="{{LOGINEMAIL}}" />
</li>
<li>
  <label for="loginpasswort">Passwort</label>
	<input type="password" class="password" name="loginpasswort" id="loginpasswort" value="{{LOGINPASSWORT}}" />
</li>
</ol>
<div class="submit"><input type="submit" class="submit" name="add" value="login" /> <a class="forgot-pw" href="keinpw.html">Passwort vergessen?</a></div>
</fieldset>
 </form>
 <p class="link-register">Noch kein Konto eröffnet? &raquo; <a href="register.html">Jetzt Registrieren</a></p>

</div>

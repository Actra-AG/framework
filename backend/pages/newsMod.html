<p class="form-required-note"><em>*</em> erforderliche Angaben</p>

<form method="post" action="newsMod-{{ID}}.html?send=1" class="form-edit">

<fieldset>

  <dl>
    <dt><label for="datum">Datum<em title="erforderlich">*</em></label></dt>
    <dd><input type="text" class="text" name="datum" id="datum" value="{{DATUM}}" /></dd>
  </dl>

  <dl>
    <dt><label for="titel">Titel<em title="erforderlich">*</em></label></dt>
    <dd><input type="text" class="text" name="titel" id="titel" value="{{TITEL}}" /></dd>
  </dl>

  <dl>
    <dt><label for="teaser">Anriss</label></dt>
    <dd><textarea name="teaser" id="teaser" cols="40" rows="10">{{TEASER}}</textarea></dd>
  </dl>

  <dl>
    <dt><label for="text">Haupttext</label></dt>
    <dd><textarea name="text" id="text" cols="40" rows="10">{{TEXT}}</textarea></dd>
  </dl>

  <dl>
    <dt>Archiv<em title="erforderlich">*</em></dt>
    <dd><input type="radio" class="radio" name="archiv" id="archiv0" value="0"{{ARCHIV0}} /> <label for="archiv0">nein</label> <input type="radio" class="radio" name="archiv" id="archiv1" value="1"{{ARCHIV1}} /> <label for="archiv1">ja</label></dd>
  </dl>
</fieldset>
    
<fieldset class="submit"><input type="submit" name="save" value="speichern" /></fieldset>
</form>

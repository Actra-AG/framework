<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>{title} | bsv-buelach.ch</title>
	<meta name="robots" content="noindex,nofollow">
	<link rel="stylesheet" href="/styles/error.css?20220211">
</head>
<body>
<div class="error">
	<h1>{title}</h1>
	<div class="debug">

		<h2>Information</h2>

		<dl class="clearfix">
			<dt>Type</dt>
			<dd>{title}</dd>
		</dl>
		<dl class="clearfix">
			<dt>Message</dt>
			<dd>{errorMessage}</dd>
		</dl>
		<dl class="clearfix">
			<dt>File</dt>
			<dd>{errorFile}</dd>
		</dl>
		<dl class="clearfix">
			<dt>Line</dt>
			<dd>{errorLine}</dd>
		</dl>
		<dl class="clearfix">
			<dt>Error</dt>
			<dd>{errorCode}</dd>
		</dl>
	</div>

	<div class="stacktrace">
		<h2>Stack trace</h2>
		<pre>{backtrace}</pre>
	</div>
</div>
</body>
</html>
